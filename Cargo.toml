[package]
name = "btrbk-nas"
version = "0.4.2"
edition = "2024"
license = "MIT"
description = "Synology DSM package to inspect the btrbk backups a NAS receives"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
