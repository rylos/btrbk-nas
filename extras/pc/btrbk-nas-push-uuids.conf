# Drop-in for btrbk.service: after every btrbk run, tell btrbk-nas on the NAS
# which snapshots this PC still holds. Install as
#   /etc/systemd/system/btrbk.service.d/btrbk-nas-push-uuids.conf
# then: systemctl daemon-reload
#
# The script reads volume, snapshot_dir, target and ssh key from
# /etc/btrbk/btrbk.conf. ExecStopPost runs whether the run succeeded or not,
# and the leading "-" keeps a failure here (NAS unreachable) from marking
# btrbk.service failed.
[Service]
ExecStopPost=-/usr/local/bin/btrbk-nas-push-uuids
